[workspace]
resolver = "2"
members = [
    "crates/clock",
    "crates/proto",
    "crates/trace-store",
    "crates/coordinator",
    "crates/shim",
]
# bench/toy is a fixture crate copied into temp dirs per run; it is not a workspace member.
exclude = ["bench"]

[workspace.package]
edition = "2021"
version = "0.1.0"
publish = false
# File::try_lock (used by the coordinator) is stable since 1.89.
rust-version = "1.89"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[workspace.dependencies]
clock = { path = "crates/clock" }
runtime-proto = { path = "crates/proto" }
trace-store = { path = "crates/trace-store" }
coordinator = { path = "crates/coordinator" }

anyhow = "1"
blake3 = "1.8"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "0.14"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
protox = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
tokio-stream = { version = "0.1", features = ["net"] }
tower = "0.5"
hyper-util = { version = "0.1", features = ["tokio"] }
rusqlite = { version = "0.41", features = ["bundled"] }
proptest = "1"
tempfile = "3"
