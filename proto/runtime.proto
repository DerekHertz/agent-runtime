// Source of truth for the shim <-> coordinator protocol (docs/SPEC.md section 7).
//
// Only the RPCs implemented so far are defined here. Release, Attach and the Orchestration
// service arrive with the issues that implement them, so their message shapes are not guessed
// ahead of time.
syntax = "proto3";

package agent_runtime.v1;

service Coordinator {
  // Hook path, called by every agent's shim.
  rpc BeforeTool(BeforeToolRequest) returns (Admission);
  rpc AfterTool(AfterToolReport) returns (Ack);
}

// No clocks in shim-facing messages: the coordinator holds every slot's clock (section 5).
message BeforeToolRequest {
  string slot = 1;
  string session_id = 2;
  string tool = 3;            // Edit, Write, NotebookEdit, Read, Bash
  string tool_input_json = 4; // raw hook tool_input; the coordinator core classifies it (paths, Bash class)
  string intent = 5;          // Bash `description` when present, else empty; agents are never prompted for it
  string tool_use_id = 6;     // hook tool_use_id; with session_id it names the call (pairs it with its AfterTool)
}

message Admission {
  enum Verdict {
    ALLOW = 0;
    DENY = 1;
    DEFER = 2;
  }
  Verdict verdict = 1;
  string reason = 2;
  string owner = 3;
  string updated_input_json = 4; // set when a Read is redirected to a released snapshot
}

// A tool call's completion report (PostToolUse). The coordinator pairs it with the call's
// BeforeTool by (session_id, tool_use_id). Every field is required: an empty string or an unset
// `result` is refused, never read as a default.
message AfterToolReport {
  string slot = 1;
  string session_id = 2;
  string tool = 3;
  string tool_input_json = 4; // raw hook tool_input reported with the completion
  string tool_use_id = 5;
  oneof result {
    ToolSuccess success = 6;
    // A failed or interrupted call (PostToolUseFailure) arrives with a later field.
  }
}

// PostToolUse: the tool returned a response.
message ToolSuccess {
  string tool_response_json = 1; // raw hook tool_response, any JSON value including `null`
}

// The report was recorded. A refused report is an error status with the reason.
message Ack {}
