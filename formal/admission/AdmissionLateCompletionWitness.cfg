\* Expected to FAIL on LateCompletionNotReached: shows the model reaches a lifecycle report followed
\* by a completion of the same session that pairs with a BeforeTool recorded before it.
SPECIFICATION Spec
CONSTANTS
    Calls = {"k1", "k2"}
    Payloads = {"p1", "p2"}
    Slots = {"s1", "s2"}
    Sessions = {"x1", "x2"}
    UseIds = {"u1", "u2"}
    Tools = {"t1", "t2"}
    Kinds = {"A", "L"}
    WithGhost = TRUE
    WithSeed = TRUE
    Mutation = "none"
INVARIANTS
    LateCompletionNotReached
