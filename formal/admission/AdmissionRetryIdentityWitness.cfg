\* Expected to FAIL on FailedIdentityNotRetried: shows the baseline reaches a call whose write
\* failed, retried with the same session and tool_use_id and admitted, so the identity part of
\* rule (c) is reached.
SPECIFICATION Spec
CONSTANTS
    Calls = {"k1", "k2"}
    Payloads = {"p1", "p2"}
    Slots = {"s1", "s2"}
    Sessions = {"x1", "x2"}
    UseIds = {"u1", "u2"}
    WithGhost = TRUE
    Mutation = "none"
INVARIANTS
    FailedIdentityNotRetried
