\* Expected to FAIL on FailureRetryNotReached: shows the baseline reaches a failure report whose
\* write failed, then its retry recorded with the failed report's id, as a failure, still paired
\* with the call's BeforeTool.
SPECIFICATION Spec
CONSTANTS
    Calls = {"k1", "k2"}
    Payloads = {"p1", "p2"}
    Slots = {"s1", "s2"}
    Sessions = {"x1", "x2"}
    UseIds = {"u1", "u2"}
    Tools = {"t1", "t2"}
    Kinds = {"B", "A", "F"}
    WithGhost = TRUE
    WithSeed = TRUE
    Mutation = "none"
INVARIANTS
    FailureRetryNotReached
