\* The same rules on the smallest scope that still shows every step, for the statechart: both
\* calls name the one slot of the run, and no name is unknown.
SPECIFICATION Spec
CONSTANTS
    Calls = {"k1", "k2"}
    Payloads = {"p1"}
    Slots = {"s1"}
    WithGhost = FALSE
    Mutation = "none"
INVARIANTS
    TypeOK
    AllowIsDurable
    DenyRecordsNothing
    IdsConsecutive
    CoreMatchesTrace
    StampsIncrease
    CallsDoNotCollide
    RowsNameStoredBlobs
