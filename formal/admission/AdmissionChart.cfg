\* The same rules on the smallest scope that still shows every step, for the statechart: both
\* calls name the one slot of the run, and no name is unknown.
\* Both carry the one session and tool_use_id, so the second call is a retry of a failed first
\* call or a refused repeat.
SPECIFICATION Spec
CONSTANTS
    Calls = {"k1", "k2"}
    Payloads = {"p1"}
    Slots = {"s1"}
    Sessions = {"x1"}
    UseIds = {"u1"}
    WithGhost = FALSE
    Mutation = "none"
INVARIANTS
    TypeOK
    AllowIsDurable
    DenyRecordsNothing
    IdsConsecutive
    CoreMatchesTrace
    StampsIncrease
    CallsDoNotCollide
    RowsNameStoredBlobs
    SessionStaysOnSlot
    CallRecordedOnce
