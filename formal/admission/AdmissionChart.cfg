\* The same rules on the smallest scope that still shows every step, for the statechart: both
\* calls name the one slot of the run, one session, one tool_use_id and one tool, no name is
\* unknown, and the run may start with that call's BeforeTool recorded. So the calls are a
\* BeforeTool and its completions, a retry of a failed call, a refused repeat, or an orphan.
SPECIFICATION Spec
CONSTANTS
    Calls = {"k1", "k2"}
    Payloads = {"p1"}
    Slots = {"s1"}
    Sessions = {"x1"}
    UseIds = {"u1"}
    Tools = {"t1"}
    Kinds = {"B", "A"}
    WithGhost = FALSE
    WithSeed = TRUE
    Mutation = "none"
INVARIANTS
    TypeOK
    AllowIsDurable
    DenyRecordsNothing
    IdsConsecutive
    CoreMatchesTrace
    StampsIncrease
    CallsDoNotCollide
    RowsNameStoredBlobs
    SessionStaysOnSlot
    CallRecordedOnce
    CallKeepsItsTool
    AfterPairsWithItsBefore
