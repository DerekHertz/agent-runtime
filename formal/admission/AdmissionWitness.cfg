\* Expected to FAIL on WitnessNotReached: shows the baseline reaches "a call failed and the
\* retry reused its id and stamp", so the passing rules are not vacuous.
SPECIFICATION Spec
CONSTANTS
    Calls = {"k1", "k2"}
    Payloads = {"p1", "p2"}
    Slots = {"s1", "s2"}
    Sessions = {"x1", "x2"}
    UseIds = {"u1", "u2"}
    WithGhost = TRUE
    Mutation = "none"
INVARIANTS
    WitnessNotReached
