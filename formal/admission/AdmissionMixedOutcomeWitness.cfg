\* Expected to FAIL on MixedOutcomesNotReached: shows the baseline reaches a call with a success
\* and a failure report (in either order) naming the same BeforeTool, every call answered, so
\* the first-completion part of rule (c) is checked across outcomes.
SPECIFICATION Spec
CONSTANTS
    Calls = {"k1", "k2"}
    Payloads = {"p1", "p2"}
    Slots = {"s1", "s2"}
    Sessions = {"x1", "x2"}
    UseIds = {"u1", "u2"}
    Tools = {"t1", "t2"}
    Kinds = {"B", "A", "F"}
    WithGhost = TRUE
    WithSeed = TRUE
    Mutation = "none"
INVARIANTS
    MixedOutcomesNotReached
