\* Expected to FAIL on IdentityRefusalNotReached: shows the baseline reaches a call of a known slot
\* refused for its identity (a repeat, or its session bound to the other slot), so rule (g) is
\* not vacuous.
SPECIFICATION Spec
CONSTANTS
    Calls = {"k1", "k2"}
    Payloads = {"p1", "p2"}
    Slots = {"s1", "s2"}
    Sessions = {"x1", "x2"}
    UseIds = {"u1", "u2"}
    WithGhost = TRUE
    Mutation = "none"
INVARIANTS
    IdentityRefusalNotReached
