\* Expected to FAIL on IdentityRefusalNotReached: shows the baseline reaches a known slot's call
\* refused for its identity or its tool, so rules (g) and (h) are not vacuous.
SPECIFICATION Spec
CONSTANTS
    Calls = {"k1", "k2"}
    Payloads = {"p1", "p2"}
    Slots = {"s1", "s2"}
    Sessions = {"x1", "x2"}
    UseIds = {"u1", "u2"}
    Tools = {"t1", "t2"}
    Kinds = {"B", "A"}
    WithGhost = TRUE
    WithSeed = TRUE
    Mutation = "none"
INVARIANTS
    IdentityRefusalNotReached
