\* Broken variant: an unknown slot is denied but its event is recorded anyway. TLC must FAIL on
\* DenyRecordsNothing.
SPECIFICATION Spec
CONSTANTS
    Calls = {"k1", "k2"}
    Payloads = {"p1", "p2"}
    Slots = {"s1", "s2"}
    WithGhost = TRUE
    Mutation = "record_unknown_slot"
INVARIANTS
    DenyRecordsNothing
