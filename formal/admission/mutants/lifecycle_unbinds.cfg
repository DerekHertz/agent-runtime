\* Broken variant: a lifecycle report unbinds its session. TLC must FAIL on SessionStaysOnSlot (the
\* ended session is then recorded on another slot).
SPECIFICATION Spec
CONSTANTS
    Calls = {"k1", "k2"}
    Payloads = {"p1", "p2"}
    Slots = {"s1", "s2"}
    Sessions = {"x1", "x2"}
    UseIds = {"u1", "u2"}
    Tools = {"t1", "t2"}
    Kinds = {"B", "L"}
    WithGhost = TRUE
    WithSeed = TRUE
    Mutation = "lifecycle_unbinds"
INVARIANTS
    SessionStaysOnSlot
