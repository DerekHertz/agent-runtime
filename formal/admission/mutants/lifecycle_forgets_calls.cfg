\* Broken variant: a lifecycle report drops its session's recorded calls. TLC must FAIL on
\* AfterPairsWithItsBefore (a late completion becomes an orphan).
SPECIFICATION Spec
CONSTANTS
    Calls = {"k1", "k2"}
    Payloads = {"p1", "p2"}
    Slots = {"s1", "s2"}
    Sessions = {"x1", "x2"}
    UseIds = {"u1", "u2"}
    Tools = {"t1", "t2"}
    Kinds = {"A", "L"}
    WithGhost = TRUE
    WithSeed = TRUE
    Mutation = "lifecycle_forgets_calls"
INVARIANTS
    AfterPairsWithItsBefore
