\* Lifecycle baseline: two calls, each a BeforeTool, a successful AfterTool or a lifecycle report
\* (Stop or SessionEnd), with the same slots, sessions, ids, tools and seed as the baseline. A failed
\* AfterTool takes the same transition as a successful one, so "F" is left to Admission.cfg.
SPECIFICATION Spec
CONSTANTS
    Calls = {"k1", "k2"}
    Payloads = {"p1", "p2"}
    Slots = {"s1", "s2"}
    Sessions = {"x1", "x2"}
    UseIds = {"u1", "u2"}
    Tools = {"t1", "t2"}
    Kinds = {"B", "A", "L"}
    WithGhost = TRUE
    WithSeed = TRUE
    Mutation = "none"
INVARIANTS
    TypeOK
    AllowIsDurable
    DenyRecordsNothing
    IdsConsecutive
    CoreMatchesTrace
    StampsIncrease
    CallsDoNotCollide
    RowsNameStoredBlobs
    SessionStaysOnSlot
    CallRecordedOnce
    CallKeepsItsTool
    AfterPairsWithItsBefore
    RowKeepsItsOutcome
