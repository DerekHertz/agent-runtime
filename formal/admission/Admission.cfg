\* Baseline: two calls, two slots (the calls may name the same slot), one name may be unknown.
SPECIFICATION Spec
CONSTANTS
    Calls = {"k1", "k2"}
    Payloads = {"p1", "p2"}
    Slots = {"s1", "s2"}
    Sessions = {"x1", "x2"}
    UseIds = {"u1", "u2"}
    WithGhost = TRUE
    Mutation = "none"
INVARIANTS
    TypeOK
    AllowIsDurable
    DenyRecordsNothing
    IdsConsecutive
    CoreMatchesTrace
    StampsIncrease
    CallsDoNotCollide
    RowsNameStoredBlobs
    SessionStaysOnSlot
    CallRecordedOnce
