\* Baseline: two calls, each a BeforeTool or an AfterTool, on two slots (the calls may name the
\* same slot; one name may be unknown), with two sessions, two tool_use_ids and two tools, and a run
\* that may start with one BeforeTool already recorded.
SPECIFICATION Spec
CONSTANTS
    Calls = {"k1", "k2"}
    Payloads = {"p1", "p2"}
    Slots = {"s1", "s2"}
    Sessions = {"x1", "x2"}
    UseIds = {"u1", "u2"}
    Tools = {"t1", "t2"}
    Kinds = {"B", "A"}
    WithGhost = TRUE
    WithSeed = TRUE
    Mutation = "none"
INVARIANTS
    TypeOK
    AllowIsDurable
    DenyRecordsNothing
    IdsConsecutive
    CoreMatchesTrace
    StampsIncrease
    CallsDoNotCollide
    RowsNameStoredBlobs
    SessionStaysOnSlot
    CallRecordedOnce
    CallKeepsItsTool
    AfterPairsWithItsBefore
