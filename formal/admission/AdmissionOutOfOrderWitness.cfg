\* Expected to FAIL on OutOfOrderPairingNotReached: shows the baseline reaches an AfterTool paired
\* with a BeforeTool that is not the latest one before it (overlapping calls completed out of
\* order).
SPECIFICATION Spec
CONSTANTS
    Calls = {"k1", "k2"}
    Payloads = {"p1", "p2"}
    Slots = {"s1", "s2"}
    Sessions = {"x1", "x2"}
    UseIds = {"u1", "u2"}
    Tools = {"t1", "t2"}
    Kinds = {"B", "A"}
    WithGhost = TRUE
    WithSeed = TRUE
    Mutation = "none"
INVARIANTS
    OutOfOrderPairingNotReached
